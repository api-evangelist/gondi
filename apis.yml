aid: gondi
name: Gondi
description: >-
  Gondi is a decentralized, non-custodial, peer-to-peer protocol for trading and
  financing NFTs, deployed on Ethereum mainnet and HypeEVM. NFT owners borrow WETH,
  HYPE, or USDC against ERC-721 / ERC-1155 collateral with pro-rata interest, no
  oracles, and no forced liquidations, while lenders compete to refinance loans to
  better terms (full, tranche, and trim-the-top refinancing). Beyond the on-chain
  smart contracts, Gondi operates an off-chain GraphQL API at api.gondi.xyz that
  powers the dApp and the official gondi-js (TypeScript) and Python SDKs: it is the
  order/offer book and indexer for generating, signing, saving, listing, hiding, and
  renegotiating loan offers, browsing collections, NFTs, listings, orders, and loans,
  and managing users, linked wallets, notifications, and API keys. Authentication is
  Sign-In With Ethereum (EIP-4361) plus programmatic API keys. Gondi is backed by
  Pantera Capital.
